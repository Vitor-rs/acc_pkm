[project]
name = "acc-pkm"
version = "0.1.0"
description = "Academic Personal Knowledge Management (PKM) - Lake, Transcripts & Literature Lake"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "youtube-transcript-api>=0.6.2",
    "httpx>=0.27.0",
    "yt-dlp>=2024.0.0",
    "pyyaml>=6.0.1",
    "pypdf>=6.19.0",
    "rich>=15.0.0",
    "bibtexparser>=2.0.1",
    "scrapling[all]>=0.4.15",
    "firecrawl-py>=4.45.0",
    "python-dotenv>=1.2.3",
    "pymupdf4llm>=1.28.2",
    "beautifulsoup4>=4.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

