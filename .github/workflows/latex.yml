name: Compile LaTeX Projects

on:
  push:
    branches: [ "main" ]
    paths:
      - 'projects/**/*.tex'
      - 'projects/**/*.bib'
      - '.github/workflows/latex.yml'
  pull_request:
    branches: [ "main" ]

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check for LaTeX projects
        id: check_projects
        run: |
          if [ -d "projects" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Compile Template / Projects
        if: steps.check_projects.outputs.found == 'true'
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: projects/_template
        continue-on-error: true

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: template-manuscript-pdf
          path: projects/_template/main.pdf
        if: steps.check_projects.outputs.found == 'true'
